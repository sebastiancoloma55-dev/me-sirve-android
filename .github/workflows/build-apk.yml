name: Construir APK de Me Sirve
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Verificar aplicación web
        run: |
          test -s app/src/main/assets/www/index.html || (echo "::error::Falta app/src/main/assets/www/index.html. Sube el HTML actualizado de Me Sirve a esa ruta y vuelve a ejecutar." && exit 1)
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
      - name: Instalar SDK requerido
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compilar APK
        run: gradle assembleDebug
      - name: Guardar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: me-sirve-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
